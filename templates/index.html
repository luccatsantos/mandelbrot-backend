<!DOCTYPE html>
<html>
<head>
  <title>Mandelbrot & Julia Viewer</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #111;
      color: white;
    }
    input, button {
      font-size: 1.2em;
      padding: 10px;
      margin: 20px;
    }
    img {
      width: 45%;
      margin: 20px;
      border: 2px solid white;
    }
  </style>
</head>
<body>
  <h1>Mandelbrot & Julia Set Viewer</h1>
  <input id="c" placeholder="Enter complex number (e.g., 0.355+0.355j)">
  <button onclick="generate()">Generate</button>

  <div id="results" style="display:none;">
    <h2>Mandelbrot Set</h2>
    <img id="mandelbrot" src="">
    <h2>Julia Set</h2>
    <img id="julia" src="">
  </div>

<script>
  const base = "https://mandelbrot-backend.onrender.com"; // or your Render URL

  function generate() {
    const c = encodeURIComponent(document.getElementById('c').value);
    document.getElementById('mandelbrot').src = `${base}/mandelbrot?c=${c}`;
    document.getElementById('julia').src = `${base}/julia?c=${c}`;
    document.getElementById('results').style.display = 'block';
  }
</script>
</body>
</html>
